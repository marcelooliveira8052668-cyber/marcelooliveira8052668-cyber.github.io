<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora iPhone Style</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css">   
    <style>
        /* CSS Estilizado */
        body { background: #f0f2f5; display: flex; justify-content: center; padding-top: 50px; }
        .iphone-x { width: 300px; height: 600px; background: #333; border-radius: 40px; padding: 15px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .screen { background: #000; width: 100%; height: 100%; border-radius: 25px; color: white; padding: 20px; display: flex; flex-direction: column; }
        .area { width: 100%; height: 80px; background: transparent; border: none; color: white; font-size: 2.5rem; text-align: right; margin-top: 50px; }
        .key { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
        button { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 1.2rem; background: #333; color: white; cursor: pointer; }
        .btn-work { background: #a5a5a5; color: black; }
        .btn-equal { background: #f39c12; }
        .time { font-size: 0.8rem; text-align: center; }
    </style>
</head>
<body>

<div class="iphone-x">
    <div class="screen">
        <div class="time" id="time"></div>
        <form class="calculator">
            <input type="text" placeholder="0" name="displayResult" class="area" readonly/>
            <div class="key">
                <button type="button" class="btn-work" onclick="document.querySelector('.area').value=''">AC</button>
                <button type="button" class="btn-work" onclick="makeNegative(displayResult.value)">+/-</button>
                <button type="button" class="btn-work" onclick="calcNumbers('%')">%</button>
                <button type="button" class="btn-work" onclick="calcNumbers('/')">/</button>
                
                <button type="button" onclick="calcNumbers('7')">7</button>
                <button type="button" onclick="calcNumbers('8')">8</button>
                <button type="button" onclick="calcNumbers('9')">9</button>
                <button type="button" class="btn-work" onclick="calcNumbers('*')">x</button>

                <button type="button" onclick="calcNumbers('4')">4</button>
                <button type="button" onclick="calcNumbers('5')">5</button>
                <button type="button" onclick="calcNumbers('6')">6</button>
                <button type="button" class="btn-work" onclick="calcNumbers('-')">-</button>

                <button type="button" onclick="calcNumbers('1')">1</button>
                <button type="button" onclick="calcNumbers('2')">2</button>
                <button type="button" onclick="calcNumbers('3')">3</button>
                <button type="button" class="btn-work" onclick="calcNumbers('+')">+</button>

                <button type="button" style="grid-column: span 2;" onclick="calcNumbers('0')">0</button>
                <button type="button" onclick="calcNumbers('.')">.</button>
                <button type="button" class="btn-equal" onclick="displayResult.value = eval(displayResult.value)">=</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Atualiza o horário automaticamente
    document.getElementById('time').textContent = new Date().getHours() + ":" + new Date().getMinutes();

    function calcNumbers(n) { document.querySelector('.area').value += n; }
    
    function makeNegative(val) {
        document.querySelector('.area').value = val.startsWith('-') ? val.substring(1) : '-' + val;
    }
</script>
</body>
</html>
