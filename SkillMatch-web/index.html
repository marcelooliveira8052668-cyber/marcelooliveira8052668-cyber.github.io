<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SkillMatch: Encontre vagas de emprego compatíveis com suas habilidades de front-end.">
    <title>SkillMatch - Encontre sua Vaga</title>
    <link rel="stylesheet" href="index.style.css">
</head>
<body>
    <header>
        <nav>
            <h1>SkillMatch</h1>
            <img src="gemini-svg.svg" alt="Logo SkillMatch" width="50">
        </nav>
    </header>

    <main>
        <section id="secao-perfil">
            <h2>Seu Perfil</h2>
            <form id="form-perfil">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required aria-label="Digite seu nome">
                
                <label for="habilidades">Habilidades (separadas por vírgula):</label>
                <input type="text" id="habilidades" placeholder="ex: HTML, CSS, React" required aria-label="Digite suas habilidades">
                
                <button type="submit">Analisar Vagas</button>
            </form>
        </section>

        <section id="secao-resultados">
            <h2>Vagas Disponíveis</h2>
            <div id="container-vagas" aria-live="polite">
                </div>
        </section>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
