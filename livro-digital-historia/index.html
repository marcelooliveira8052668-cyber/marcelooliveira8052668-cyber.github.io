<header id="barra">
  <button id="btnMenu" type="button" title="Abrir sumário">&#9776;</button>
  <div id="edicao">História em Foco</div>
  <div id="buscaBox">
    <input id="txtBusca" type="search" placeholder="Buscar capítulo (ex.: 1.28) ou palavra" autocomplete="off" spellcheck="false">

  </div>

</header>

<nav id="painel" aria-label="Sumário do livro">
  <h4>Sumário</h4>
  <div id="sumarioDiv"></div>
</nav>
<div id="cortina" hidden></div>

<button id="setaE" class="seta" type="button" title="Página anterior">&#8249;</button>
<button id="setaD" class="seta" type="button" title="Próxima página">&#8250;</button>

<main id="palco">
  <div id="folhaEsq" class="folha">

  </div>
  <div id="folhaDir" class="folha">

  </div>

</div>

<div id="avisoBusca" hidden></div>
<div id="tt" hidden></div>
<div id="dica" hidden></div>
<div id="viewer" hidden>
  <span id="viewerFechar" title="Fechar">&#10005;</span>
  <img id="viewerImg" alt="">
  <p id="viewerCap"></p>
</div>

<script>
  window.ORDEM = [];
  window.ADICIONAR = function (partes) {
    for (var i = 0; i < partes.length; i++) { window.ORDEM.push(partes[i]); }
  };
  window.LIVRO = {
    titulo: "História em Foco",
    subtitulo: "Uma viagem pela história da humanidade — do Egito ao Brasil de hoje.",
    autor: "Professor Marcelo Oliveira-História Geral",
    edicao: "1ª edição",
    editora: "Editora Foco & Tempo",
    citacao: "\u201CNão se conhece a si mesmo quem não conhece a sua história.\u201D",
    capaTexto: "Capítulos 1.1 a 1.93",
    sinopse: [
      "Este livro é uma jornada pelo tempo: começa nas margens do Nilo e do Eufrates, atravessa a Idade Média, acompanha as grandes navegações, as revoluções que redesenharam o mundo e chega ao Brasil de ontem e de hoje.",
      "Os 93 capítulos foram escritos em linguagem simples e direta, pensados para uma leitura leve, mas profunda. Palavras difíceis aparecem sublinhadas: toque ou passe o mouse sobre elas para ver o significado na hora.",
      "Abra o capítulo que quiser ou siga a ordem das páginas. Boa viagem!"
    ]
  };
</script>
